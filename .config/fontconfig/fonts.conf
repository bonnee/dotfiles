<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>lcddefault</const>
        </edit>
    </match>

    <!-- Iosevka has no TrueType hinting instructions, so "slight" hinting means
         FreeType's light autohinter (autohinter + warp). Alacritty rasterizes its
         glyph set at startup and that costs ~0.3s with hintslight; without
         hinting it is ~0.01s. Other fonts keep hintslight.
         (One <string> per <test>: fontconfig ignores extra values.) -->
    <match target="font">
        <test name="family" qual="any">
            <string>Iosevka</string>
        </test>
        <edit name="hintstyle" mode="assign">
            <const>hintnone</const>
        </edit>
    </match>

    <alias>
      <family>serif</family>
      <prefer>
	<family>Noto Serif</family>
	<family>Droid Serif</family>
      	<family>Roboto Slab</family>
	<family>Symbols Nerd Font</family>
	<family>Font Awesome 7 Free</family>
	<family>Font Awesome 7 Brands</family>
      </prefer>
    </alias>
    <alias>
      <family>sans-serif</family>
      <prefer>
	<family>Noto Sans</family>
	<family>Open Sans</family>
      	<family>Droid Sans</family>
      	<family>Roboto</family>
	<family>Symbols Nerd Font</family>
	<family>Font Awesome 7 Free</family>
	<family>Font Awesome 7 Brands</family>
      </prefer>
    </alias>
    <alias>
      <family>monospace</family>
      <prefer>
	<family>Iosevka</family>
	<family>Noto Sans Mono</family>
	<family>Symbols Nerd Font</family>
	<family>Font Awesome 7 Free</family>
	<family>Font Awesome 7 Brands</family>
      </prefer>
    </alias>
</fontconfig>