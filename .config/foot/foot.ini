# foot(1) config — mirrors the look of the Alacritty setup:
# Iosevka Extended 16pt, pywal palette, no padding, bold drawn in bright colors.

[main]
# Keep TERM as it was under Alacritty: remote hosts have xterm-256color
# terminfo, not foot's (COLORTERM=truecolor is still advertised either way).
term=xterm-256color
font=Iosevka Extended:size=16
pad=2x2
dpi-aware=no
bold-text-in-bright=yes

[colors-dark]
alpha=0.85
background=0C110E
foreground=daeafc
regular0=0C110E
regular1=989665
regular2=727e79
regular3=B9B048
regular4=5f818f
regular5=767b90
regular6=7B8074
regular7=a3afbc
bright0=5c846d
bright1=d6d272
bright2=668b7c
bright3=fff24c
bright4=508396
bright5=7279a1
bright6=a2b687
bright7=daeafc

# Shift+Return sends ESC CR (was a custom binding in alacritty.toml).
[text-bindings]
\x1b\x0d=Shift+Return
