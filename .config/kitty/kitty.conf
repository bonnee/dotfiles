# kitty.conf - same look as the Alacritty/foot setup:
# Iosevka Extended 16pt, the pywal palette, 0.85 opacity, 2px padding.
# TERM stays xterm-256color so remote hosts keep working (kitty would otherwise
# advertise xterm-kitty, which most servers do not have terminfo for).

font_family       Iosevka Extended
bold_font         Iosevka Extended Bold
italic_font       Iosevka Extended Italic
bold_italic_font  Iosevka Extended Bold Italic
font_size         16.0

term                      xterm-256color
background_opacity        0.85
dynamic_background_opacity yes
window_padding_width      2
cursor_blink_interval     0
# kitty draws the cursor hollow when the window is not focused; keep the filled
# block that alacritty and foot show, focused or not.
cursor_shape              block
cursor_shape_unfocused    unchanged
enable_audio_bell         no
scrollback_lines          10000
# No "are you sure you want to exit" when closing a window or tab (default -1
# asks as soon as one kitty window is in the OS window, which is always here).
confirm_os_window_close   0

# Shift+Return sends ESC CR - the one custom binding the other terminals had.
map shift+enter send_text all \x1b\r

# Palette: the pywal values as defaults, so the first frame is already right.
# kitty also accepts OSC 4/10/11 at runtime, so wpg/pywal recolours it live.
background #050505
foreground #ffffff
cursor     #ffffff
color0  #050505
color1  #7D7D7D
color2  #838383
color3  #B1B1B1
color4  #8B8B8B
color5  #9A9A9A
color6  #939393
color7  #dddddd
color8  #777777
color9  #b29292
color10 #bb9999
color11 #fdcfcf
color12 #c6a2a2
color13 #dcb4b4
color14 #d2acac
color15 #ffffff
