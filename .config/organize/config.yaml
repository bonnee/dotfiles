# Keep ~/Downloads shallow: recent files stay one level inside a category,
# anything older than 12 months is swept into an archive tree.
#
# Layout:
#   ~/Downloads/_sorted/<Category>/            files from the last 12 months
#   ~/Downloads/_archive/<year>/<Category>/    older files, by modification year
#
# Passes, in order:
#   1. byte-identical browser duplicates at the top level -> trash
#   2. top-level files -> _sorted/<Category>/ (extension rules)
#   3. _sorted files older than 12 months -> _archive/<year>/<Category>/
#
# Age is measured with modification time, not birth time: everything restored
# in Feb 2026 has a 2026 btime, which would keep the 2013-2025 backlog
# "recent" forever. Subfolders of ~/Downloads are never scanned except by the
# archive sweeper, which only looks inside _sorted.
#
# Nothing is deleted outright: duplicates go to the trash. Name collisions get
# a counter (on_conflict defaults to rename_new).
#
# Simulate with:  organize sim
# Apply with:     organize run

ext_cad: &cad
  - step
  - stp
  - stl
  - 3mf
  - obj
  - f3d
  - fcstd
  - sldprt
  - sldasm
  - catpart
  - catproduct
  - ipt
  - iam
  - skp
  - dxf
  - dwg
  - csg
  - blend
  - scad

ext_images: &images
  - png
  - jpg
  - jpeg
  - gif
  - webp
  - svg
  - bmp
  - tif
  - tiff
  - heic
  - psd
  - xcf
  - cr2
  - nef
  - arw

