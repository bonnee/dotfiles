ext_media: &media
  - mp4
  - mkv
  - avi
  - mov
  - webm
  - mp3
  - wav
  - flac
  - m4a
  - ogg

ext_code: &code
  - py
  - s
  - c
  - h
  - cpp
  - hpp
  - js
  - ts
  - sh
  - lua
  - rs
  - go
  - java
  - ino
  - ipynb
  - jar
  - fcmacro
  - kicad_pcb
  - kicad_sch
  - sch
  - brd

rules:
  # ---- 1. duplicates ------------------------------------------------------
  # Byte-for-byte comparison, not name matching. Restricted to browser-style
  # "(1)" / "(2)" copies so differently-named pairs (a contract filed under two
  # names, board revisions) are never touched. detect_original_by sorts by
  # name and is reversed, so the name without the counter is kept.
  - name: "Trash byte-identical duplicates"
    locations: ~/Downloads
    subfolders: false
    filters:
      - duplicate:
          detect_original_by: "-name"
      - name:
          match: "*(*)*"
      - not empty
    actions:
      - trash

  # ---- 2. sort top-level files into categories ----------------------------
  - name: "CAD"
    locations: ~/Downloads
    subfolders: false
    filters:
      - extension: *cad
    actions:
      - move: ~/Downloads/_sorted/CAD/

  - name: "Images"
    locations: ~/Downloads
    subfolders: false
    filters:
      - extension: *images
    actions:
      - move: ~/Downloads/_sorted/Images/

  - name: "Documents"
    locations: ~/Downloads
    subfolders: false
    filters:
      - extension: *documents
    actions:
      - move: ~/Downloads/_sorted/Documents/

  - name: "Installers"
    locations: ~/Downloads
    subfolders: false
    filters:
      - extension: *installers
    actions:
      - move: ~/Downloads/_sorted/Installers/

  - name: "Data and firmware"
    locations: ~/Downloads
    subfolders: false
    filters:
      - extension: *data
    actions:
      - move: ~/Downloads/_sorted/Data/

  - name: "Archives"
    locations: ~/Downloads
    subfolders: false
    filters:
      - extension: *archives
    actions:
      - move: ~/Downloads/_sorted/Archives/

  - name: "Media"
    locations: ~/Downloads
    subfolders: false
    filters:
      - extension: *media
    actions:
      - move: ~/Downloads/_sorted/Media/

  - name: "Code"
    locations: ~/Downloads
    subfolders: false
    filters:
      - extension: *code
    actions:
      - move: ~/Downloads/_sorted/Code/

  # Quick downloads with no matching category stay visible for a day.
  - name: "Misc"
    locations: ~/Downloads
    subfolders: false
    filters:
      - lastmodified:
          days: 1
          mode: older
    actions:
      - move: ~/Downloads/_sorted/Misc/

  # ---- 3. age out: older than 12 months --------------------------------
  # Walks _sorted recursively; the category is the file's parent folder and
  # the year comes from modification time.
  - name: "Archive: older than 12 months"
    locations: ~/Downloads/_sorted
    subfolders: true
    filters:
      - lastmodified:
          days: 365
          mode: older
    actions:
      - move: "~/Downloads/_archive/{lastmodified.year}/{path.parent.name}/"
