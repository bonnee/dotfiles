# Sort files in ~/Downloads into category folders.
#
# Three passes, in order:
#   1. byte-identical duplicates at the top level -> trash (recoverable)
#   2. files created in the last 30 days        -> _sorted/<Category>/
#   3. anything older                           -> _sorted/<Category>/<year>/
#
# "Older" is based on birth time, so on this filesystem the pre-2026 backlog
# lands in year folders. Subfolders inside ~/Downloads are never scanned, so
# _sorted/ and existing project folders are left alone.
#
# Nothing is deleted outright: duplicates go to the trash. On a name collision
# organize appends a counter (on_conflict defaults to rename_new).
#
# Simulate with:  organize sim
# Apply with:     organize run

ext_cad: &cad
  - step
  - stp
  - stl
  - 3mf
  - obj
  - f3d
  - fcstd
  - sldprt
  - sldasm
  - catpart
  - catproduct
  - ipt
  - iam
  - skp
  - dxf
  - dwg
  - csg
  - blend
  - scad

ext_images: &images
  - png
  - jpg
  - jpeg
  - gif
  - webp
  - svg
  - bmp
  - tif
  - tiff
  - heic
  - psd
  - xcf
  - cr2
  - nef
  - arw

ext_documents: &documents
  - pdf
  - doc
  - docx
  - xls
  - xlsx
  - ppt
  - pptx
  - odt
  - ods
  - odp
  - txt
  - md
  - rtf
  - ics
  - html
  - htm
  - epub

ext_installers: &installers
  - exe
  - msi
  - msix
  - appx
  - iso
