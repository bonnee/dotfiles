ext_data: &data
  - dbc
  - trc
  - blf
  - asc
  - arxml
  - a2l
  - ldf
  - sym
  - dcm
  - hex
  - s19
  - mot
  - uf2
  - dfu
  - bin
  - enc
  - json
  - xml
  - csv
  - yaml
  - yml
  - xmp

ext_archives: &archives
  - zip
  - 7z
  - rar
  - tar
  - gz
  - xz
  - bz2
  - zst
  - tgz
  - tbz2
  - cab

ext_media: &media
  - mp4
  - mkv
  - avi
  - mov
  - webm
  - mp3
  - wav
  - flac
  - m4a
  - ogg

ext_code: &code
  - py
  - s
  - c
  - h
  - cpp
  - hpp
  - js
  - ts
  - sh
  - lua
  - rs
  - go
  - java
  - ino
  - ipynb
  - jar
  - fcmacro
  - kicad_pcb
  - kicad_sch
  - sch
  - brd

rules:
  # ---- 1. duplicates ------------------------------------------------------
  # Byte-for-byte comparison, not name matching. Restricted to browser-style
  # "(1)" / "(2)" copies so that differently-named pairs (a contract filed
  # under two names, board revisions) are never touched. The plain name wins:
  # detect_original_by sorts by name, so reversing it keeps the last-
  # alphabetical name — the one without the counter.
  - name: "Trash byte-identical duplicates"
    locations: ~/Downloads
    subfolders: false
    filters:
      - duplicate:
          detect_original_by: "-name"
      - name:
          match: "*(*)*"
      - not empty
    actions:
      - trash

  # ---- 2. recent files (last 30 days) -------------------------------------
  - name: "CAD (recent)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: newer}
      - extension: *cad
    actions:
      - move: ~/Downloads/_sorted/CAD/

  - name: "Images (recent)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: newer}
      - extension: *images
    actions:
      - move: ~/Downloads/_sorted/Images/

  - name: "Documents (recent)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: newer}
      - extension: *documents
    actions:
      - move: ~/Downloads/_sorted/Documents/

  - name: "Installers (recent)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: newer}
      - extension: *installers
    actions:
      - move: ~/Downloads/_sorted/Installers/

  - name: "Data and firmware (recent)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: newer}
      - extension: *data
    actions:
      - move: ~/Downloads/_sorted/Data/

  - name: "Archives (recent)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: newer}
      - extension: *archives
    actions:
      - move: ~/Downloads/_sorted/Archives/

  - name: "Media (recent)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: newer}
      - extension: *media
    actions:
      - move: ~/Downloads/_sorted/Media/

  - name: "Code (recent)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: newer}
      - extension: *code
    actions:
      - move: ~/Downloads/_sorted/Code/

  # Quick downloads with no matching category stay visible for a day.
  - name: "Misc (recent)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: newer}
      - created: {days: 1, mode: older}
    actions:
      - move: ~/Downloads/_sorted/Misc/

  # ---- 3. backlog (older than 30 days), bucketed by year ------------------
  - name: "CAD (backlog)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: older}
      - lastmodified
      - extension: *cad
    actions:
      - move: "~/Downloads/_sorted/CAD/{lastmodified.year}/"

  - name: "Images (backlog)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: older}
      - lastmodified
      - extension: *images
    actions:
      - move: "~/Downloads/_sorted/Images/{lastmodified.year}/"

  - name: "Documents (backlog)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: older}
      - lastmodified
      - extension: *documents
    actions:
      - move: "~/Downloads/_sorted/Documents/{lastmodified.year}/"

  - name: "Installers (backlog)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: older}
      - lastmodified
      - extension: *installers
    actions:
      - move: "~/Downloads/_sorted/Installers/{lastmodified.year}/"

  - name: "Data and firmware (backlog)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: older}
      - lastmodified
      - extension: *data
    actions:
      - move: "~/Downloads/_sorted/Data/{lastmodified.year}/"

  - name: "Archives (backlog)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: older}
      - lastmodified
      - extension: *archives
    actions:
      - move: "~/Downloads/_sorted/Archives/{lastmodified.year}/"

  - name: "Media (backlog)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: older}
      - lastmodified
      - extension: *media
    actions:
      - move: "~/Downloads/_sorted/Media/{lastmodified.year}/"

  - name: "Code (backlog)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: older}
      - lastmodified
      - extension: *code
    actions:
      - move: "~/Downloads/_sorted/Code/{lastmodified.year}/"

  - name: "Misc (backlog)"
    locations: ~/Downloads
    subfolders: false
    filters:
      - created: {days: 30, mode: older}
      - lastmodified
    actions:
      - move: "~/Downloads/_sorted/Misc/{lastmodified.year}/"
