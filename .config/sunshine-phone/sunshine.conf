# phone-dash: Sunshine instance streaming sway's HEADLESS-1 to Moonlight on
# the phone. Separate from ~/.config/sunshine (Steam streaming): own ports,
# state, keys and apps. Started by phone-dash-sunshine.service.
sunshine_name = arch23-phone
port = 49989
address_family = ipv4
upnp = disabled
origin_web_ui_allowed = pc

capture = wlr
output_name = HEADLESS-1
encoder = vaapi
adapter_name = /dev/dri/renderD128

# The phone shows video only; don't touch the PC's audio routing.
stream_audio = disabled

file_state = /home/bonnee/.config/sunshine-phone/sunshine_state.json
credentials_file = /home/bonnee/.config/sunshine-phone/sunshine_state.json
file_apps = /home/bonnee/.config/sunshine-phone/apps.json
pkey = /home/bonnee/.config/sunshine-phone/credentials/cakey.pem
cert = /home/bonnee/.config/sunshine-phone/credentials/cacert.pem
log_path = /home/bonnee/.config/sunshine-phone/sunshine.log

# Touch comes from phone-dash-touch (real multitouch); Moonlight on Android
# would send the same touches again as mouse events.
mouse = disabled
