# phone-dash: the OnePlus 6T (USB) as a third monitor.
#
# Virtual output HEADLESS-1 -> wayvnc (phone-dash-vnc.service) -> USB
# tethering, or the adb tunnel as fallback (phone-dash-adb.service) -> AVNC on
# the phone. The Home Assistant kiosk (phone-dash-hass.service) is the phone's
# background; any other window on the phone replaces it, tiled
# (phone-dash-daemon.service). The phone screen sleeps with the monitors
# (daemon) and with the system (phone-dash-sleep.service, a system unit).
# Shared settings: ~/.config/phone-dash/env.

# Mode, position and scale live only here (kanshi's desk_phone profile just
# lists HEADLESS-1 so it matches; kanshi doesn't re-apply on a sway reload).
output HEADLESS-1 mode 2340x1080@60Hz position 3300 1440 scale 3.5

# Workspaces of the phone output. Without a matching rule a new output gets
# the LOWEST FREE NUMBER (that is how workspace 2 once landed on the phone).
# HEADLESS-2..4 cover a re-created output (numbers aren't reused in a session).
workspace 11:dash output HEADLESS-1 HEADLESS-2 HEADLESS-3 HEADLESS-4
# Hidden: where the kiosk is parked while another window is on the phone.
workspace 11:dash-bg output HEADLESS-1 HEADLESS-2 HEADLESS-3 HEADLESS-4

# Second seat for the phone (wayvnc -s phone), so taps there don't move the
# main mouse/keyboard focus. It must exist before apps start: Firefox/GTK
# only take input from seats that existed at their launch (kitty and
# Chromium only ever use the first seat, which stays seat0).
# seat0 must be the explicit fallback, or sway leaves new/re-probed physical
# devices on no seat at all once another seat is configured.
seat seat0 fallback true
seat phone fallback false
# Pin wayvnc's virtual devices here, or a seat re-config moves them to seat0.
seat phone attach "0:0:wlr_virtual_pointer_v1"
seat phone attach "0:0:wlr_virtual_keyboard_v1"
# Hide the phone seat's pointer once the finger stops (ms).
# (No custom invisible cursor theme: it coincided with two sway aborts in
# wlr_cursor_set_xcursor -> wlr_swapchain_create(0x0) on 2026-11-26.)
seat phone hide_cursor 2000

# Create the virtual output once per session (exec doesn't re-run on reload;
# guarded so it can never add a second one, which would be HEADLESS-2).
exec sh -c 'swaymsg -t get_outputs -r | grep -q HEADLESS- || swaymsg create_output'

# A reload re-applies seat config, which leaves wayvnc's virtual devices on
# the phone seat stale: restart wayvnc (phone-dash-adb reconnects AVNC).
# try-restart: no-op at login, before the service is up.
exec_always systemctl --user try-restart phone-dash-vnc.service

# Phone slot: $mod+p sends the focused window to the phone, or back if it is
# the phone window; $mod+Shift+p sends the phone window back from anywhere.
bindsym $mod+p exec phone-dash-send toggle
bindsym $mod+Shift+p exec phone-dash-send return
