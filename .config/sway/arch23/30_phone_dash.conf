# Phone (OnePlus 6T over USB) as a third monitor.
# A virtual output is streamed by wayvnc (phone-dash-vnc.service) and tunnelled
# over adb (phone-dash-adb.service). The HA dashboard tiles as the background;
# phone-dash-floater floats every other window on top of it.
#
# Position/scale are also in ~/.config/kanshi/config (profile desk_phone):
# kanshi re-applies the whole layout whenever an output appears, so keep both
# in sync. The mode is set only here (applied when the output is created).
output HEADLESS-1 mode 2340x1080@60Hz position 3300 1440 scale 3.5

# When an output appears with no workspace, sway names its first workspace
# after the first `workspace ... output` rule that matches it, and if none does
# it takes the LOWEST FREE NUMBER (that is how workspace 2 once ended up on the
# phone). The extra HEADLESS-n names cover a re-created output (headless
# numbers are never reused within a sway session), so the phone always gets
# 11:dash and never a numbered workspace.
workspace 11:dash output HEADLESS-1 HEADLESS-2 HEADLESS-3 HEADLESS-4

# Persistent second seat for the phone (wayvnc -s phone). It must exist before
# apps start: Firefox/GTK only accept input from seats present at their launch.
# fallback false keeps new physical devices on seat0.
# seat0 must be the explicit fallback: once another seat is configured, sway
# otherwise leaves new/re-probed physical devices on no seat at all.
seat seat0 fallback true
seat phone fallback false
# Pin wayvnc's virtual devices here; otherwise any seat re-config or reload
# moves them back to seat0.
seat phone attach "0:0:wlr_virtual_pointer_v1"
seat phone attach "0:0:wlr_virtual_keyboard_v1"
# Hide the phone seat's pointer right after each touch (seat0 unaffected).
seat phone hide_cursor 2000
# Invisible cursor theme (~/.local/share/icons/phone-dash-invisible) so the
# phone pointer is not shown even while a finger is down/dragging.
seat phone xcursor_theme phone-dash-invisible 24

for_window [app_id="^hass-dash-ff$"] move to workspace 11:dash, border none

# Startup only (exec does not re-run on reload). Guarded so it can never add a
# second headless output (which would be HEADLESS-2, not what wayvnc expects).
exec sh -c 'swaymsg -t get_outputs -r | grep -q HEADLESS- || swaymsg create_output'
# HA kiosk: phone-dash-hass.service (auto-restarts if closed)
exec phone-dash-floater
# phone-dash-vnc.service / phone-dash-adb.service are started by
# sway-session.target (enabled units); the vnc unit waits for HEADLESS-1.

# Re-arm phone input after every sway reload (see script).
exec_always phone-dash-reconnect

# Phone slot: $mod+p sends the focused window to the phone (fullscreen over the
# dashboard) or, if it is already there, sends it back. $mod+Shift+p returns
# whatever is on the phone from anywhere.
bindsym $mod+p exec phone-dash-send toggle
bindsym $mod+Shift+p exec phone-dash-send return
