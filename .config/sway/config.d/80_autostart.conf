#################################################
#####                Autorun                #####
#################################################

exec autotiling-rs

exec sh -c 'while [ -S "$SWAYSOCK" ]; do sleep 0.5; $term --class dropterm; done'
exec sh -c 'if command -v qalc >& /dev/null; then while [ -S "$SWAYSOCK" ]; do sleep 0.5; $term --class dropmath -e qalc; done; fi'
exec sh -c 'if command -v nvim >& /dev/null; then while [ -S "$SWAYSOCK" ]; do sleep 0.5; $term --class dropnote -e nvim; done; fi'

exec rm -f $WOBSOCK && mkfifo $WOBSOCK && tail -f $WOBSOCK | wob

# nm-applet is started by the XDG autostart entry via uwsm (app-nm-applet@autostart)
exec sh -c 'sleep 1; trayscale --hide-window'
exec kdeconnect-indicator &
exec birdtray &

#exec wayvnc -o HEADLESS-1 0.0.0.0

# Let root run X apps
exec --no-startup-id xhost +SI:localuser:root

# XDG autostart (~/.config/autostart, /etc/xdg/autostart) is handled by uwsm
# as app-*@autostart.service units in app-graphical.slice.

# Hand the session env to systemd/D-Bus and signal the compositor unit ready
exec uwsm finalize
exec systemctl --user start sway-session.target
