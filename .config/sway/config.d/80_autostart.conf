#################################################
#####                Autorun                #####
#################################################

exec autotiling-rs

# foot server: footclient (the terminal) needs it; new windows then open in
# ~80ms instead of ~160ms. Must come before the dropwin lines below.
exec foot --server

exec dropwin dropterm
exec sh -c 'command -v qalc >/dev/null && exec dropwin dropmath -e qalc'
exec sh -c 'command -v nvim >/dev/null && exec dropwin dropnote -e nvim'

exec rm -f $WOBSOCK && mkfifo $WOBSOCK && tail -f $WOBSOCK | wob

# nm-applet is started by the XDG autostart entry via uwsm (app-nm-applet@autostart)
exec sh -c 'sleep 1; trayscale --hide-window'
exec kdeconnect-indicator &
exec birdtray &

#exec wayvnc -o HEADLESS-1 0.0.0.0

# Let root run X apps
exec --no-startup-id xhost +SI:localuser:root

# XDG autostart (~/.config/autostart, /etc/xdg/autostart) is handled by uwsm
# as app-*@autostart.service units in app-graphical.slice.

# Hand the session env to systemd/D-Bus, then start the session units (kanshi,
# mako, swayidle, polkit-gnome) once WAYLAND_DISPLAY is importable.
exec sh -c 'uwsm finalize && systemctl --user start sway-session.target'
