# syncthingtray needs a StatusNotifierWatcher (waybar's tray module). At session
# start it is launched a second after waybar, before the watcher is registered,
# and it then aborts with a "no tray area" error dialog. Wait for the watcher
# instead (up to 10 s) so the failure never happens; no restart loop, so a real
# failure shows at most one dialog.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 40); do [ "$(gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.NameHasOwner org.kde.StatusNotifierWatcher 2>/dev/null)" = "(true,)" ] && exit 0; sleep 0.25; done; exit 0'
