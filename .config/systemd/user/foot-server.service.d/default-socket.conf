# Use foot's own server socket (default path
# $XDG_RUNTIME_DIR/foot-$WAYLAND_DISPLAY.sock) instead of the packaged
# socket-activated one on %t/foot.sock: with the latter, every footclient call
# ($term, dropwin, $TERMINAL) would need --server-socket=PATH.
[Unit]
Requires=
# uwsm imports the session environment last (WAYLAND_DISPLAY); starting earlier
# trips ConditionEnvironment and the unit is skipped.
After=graphical-session.target sway-session.target

[Service]
ExecStart=
ExecStart=/usr/bin/foot --server
Restart=on-failure
RestartSec=1

[Install]
WantedBy=
WantedBy=sway-session.target
